# ---- Build Performance ----
org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# ---- Project Version ----
# Single source of truth for the project version; build.gradle reads this via
# providers.gradleProperty('version'). Kept here rather than hardcoded in build.gradle so that
# a stale literal can never drift from the version actually being developed, and so a local
# build produces correctly named artifacts (JToon-<version>.jar) instead of a fallback number.
# The release workflow overwrites this from the git tag before building, so the published
# version always matches the tag.
version=2.0.5

# ---- Reproducible Builds ----
# Remove build time from JAR manifests for bit-identical outputs
systemProp.org.gradle.internal.launcher.welcomeMessageEnabled=false
